name: zerotrust_authenticator
description: "Zero-Trust Authenticator: sign-in codes for your accounts, end-to-end encrypted and typed for you."
publish_to: none
version: 0.3.1+4

environment:
  sdk: ^3.9.0

# Builds SQLite3MultipleCiphers instead of plain SQLite, so the core's local
# store is encrypted as a whole file (see Zero-Trust-Core README, "Sync").
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Shared account, keys, sync, settings and look of every Zero-Trust app.
  # Core Dev of 2026-11-23 (after 0.13.0). Never add cryptography_flutter: it breaks
  # the core's key derivation.
  zero_trust_core:
    git:
      url: https://github.com/EdoSag/Zero-Trust-Core.git
      path: packages/zero_trust_core
      # Includes Core PR #89 and #90: an import or a large sync no longer
      # freezes the app.
      ref: cbea78e579d5439ae99abdaaea2a74cac341e26c
  flutter_riverpod: ^3.5.0
  supabase_flutter: ^2.9.0
  # Reset links from account emails (EmailLinks).
  app_links: ">=6.4.0 <8.0.0"
  flutter_dotenv: ^6.0.1
  intl: any
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  # HMAC-SHA1/256/512 for the codes (RFC 4226, RFC 6238), synchronous and
  # pure Dart.
  crypto: ^3.0.6
  # scrypt, to open an encrypted Aegis backup (pure Dart).
  pointycastle: ^4.0.0
  # Scans a QR code with the camera (ZXing, no Google services), the same
  # scanner the suite's sharing screens use.
  qr_code_scanner_plus: ">=2.1.2 <2.2.0"
  # Shows one account as a QR code, to move it to another app.
  qr_flutter: ^4.1.0
  # Picks a backup file, or a picture of a QR code, to import.
  file_picker: ^13.3.2
  # Reads a QR code out of a picked picture (pure Dart).
  zxing2: ^0.2.4
  image: ^4.13.1
  # Hands an exported backup file to the system share sheet.
  share_plus: ^13.3.1

dev_dependencies:
  # Release checks every Zero-Trust app runs in CI (keys, sync, sign-in, app
  # setup, database). Same commit as zero_trust_core above.
  zt_release_checks:
    git:
      url: https://github.com/EdoSag/Zero-Trust-Core.git
      path: packages/zt_release_checks
      ref: cbea78e579d5439ae99abdaaea2a74cac341e26c
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
